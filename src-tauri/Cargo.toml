[package]
name = "grsai-image-and-video-generator"
version = "0.1.1"
description = "Grsai Image and Video Generator desktop client (Tauri rewrite)"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "grsai_image_and_video_generator_lib"
# Only what the desktop binary needs. The scaffold also builds staticlib and cdylib
# for mobile targets, which cost several hundred MB and a slower link on every build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：缩略图、历史记录里的图和试听音频要靠 asset 协议读本地文件
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "system-proxy"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }

# 读剪贴板里的文件列表要直接调系统接口，剪贴板插件没有这一项
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = 3
panic = "abort"
strip = true
